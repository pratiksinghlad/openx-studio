name: PR Agent (OpenRouter)

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  pr_agent:
    name: PR Agent Code Review
    # Run only for PR events or comments made on PRs (not standard issues), ignoring bot comments
    if: ${{ (github.event.pull_request || github.event.issue.pull_request) && github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run PR Agent Action
        id: pragent
        uses: the-pr-agent/pr-agent@main
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY || secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_KEY || secrets.OPENROUTER_API_KEY }}
          OPENAI_KEY: ${{ secrets.OPENROUTER_KEY || secrets.OPENROUTER_API_KEY }}
          OPENAI_BASE: "https://openrouter.ai/api/v1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG.AUTO_DESCRIBE: "true"
          PR_REVIEWER.INLINE_CODE_COMMENTS: "true"
          PR_REVIEWER.NUM_CODE_SUGGESTIONS: "4"
          CONFIG.MODEL: "openrouter/thinkingmachines/inkling:free"
          CONFIG.FALLBACK_MODELS: "['openrouter/nvidia/nemotron-3.5-lightning:free']"
          CONFIG.CUSTOM_MODEL_MAX_TOKENS: "32000"
