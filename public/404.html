<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting to OpenX Studio...</title>
    <script>
      (function () {
        var loc = window.location;
        var pathname = loc.pathname;
        var base = pathname.indexOf('/openx-studio') === 0 ? '/openx-studio' : '';
        var route = pathname.slice(base.length);
        if (route.charAt(0) !== '/') {
          route = '/' + route;
        }
        var target = (base ? base : '') + '/?' + encodeURIComponent(route + loc.search) + loc.hash;
        loc.replace(target);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="./">OpenX Studio</a>...</p>
  </body>
</html>
